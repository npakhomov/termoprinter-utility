name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0-beta"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish Windows x86 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REF_NAME
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          }

          if ($version -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like v0.1.0 or v0.1.0-beta"
          }

          $semver = $version.TrimStart('v')
          $fileVersion = ($semver -replace '-.*$', '') + ".0"
          $isPrerelease = $semver.Contains("-").ToString().ToLowerInvariant()
          "tag=$version" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "fileversion=$fileVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.401"

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\ThermoPrinterTool.csproj --locked-mode -r win-x86

      - name: Publish single-file exe
        shell: pwsh
        env:
          RELEASE_SEMVER: ${{ steps.version.outputs.semver }}
          RELEASE_FILE_VERSION: ${{ steps.version.outputs.fileversion }}
        run: |
          dotnet publish .\ThermoPrinterTool.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:RELEASE_SEMVER `
            -p:AssemblyVersion=$env:RELEASE_FILE_VERSION `
            -p:FileVersion=$env:RELEASE_FILE_VERSION `
            -p:InformationalVersion=$env:RELEASE_SEMVER `
            -o .\publish\release

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\release-artifacts | Out-Null
          Copy-Item .\publish\release\ThermoPrinterTool.exe .\release-artifacts\ThermoPrinterTool.exe -Force
          Compress-Archive -Path .\release-artifacts\ThermoPrinterTool.exe -DestinationPath .\release-artifacts\ThermoPrinterTool.zip -Force
          $hash = (Get-FileHash .\release-artifacts\ThermoPrinterTool.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath .\release-artifacts\ThermoPrinterTool.exe.sha256 -Value "$hash *ThermoPrinterTool.exe" -Encoding ascii -NoNewline

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "ThermoPrinterTool $tag"
          $prereleaseArgs = @()
          if ($env:RELEASE_PRERELEASE -eq "true") {
            $prereleaseArgs += "--prerelease"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              .\release-artifacts\ThermoPrinterTool.exe `
              .\release-artifacts\ThermoPrinterTool.exe.sha256 `
              .\release-artifacts\ThermoPrinterTool.zip `
              --title $title `
              --notes "Automatic ThermoPrinterTool build $tag" `
              @prereleaseArgs
          } else {
            gh release upload $tag `
              .\release-artifacts\ThermoPrinterTool.exe `
              .\release-artifacts\ThermoPrinterTool.exe.sha256 `
              .\release-artifacts\ThermoPrinterTool.zip `
              --clobber
          }

      - name: Update permanent beta download
        if: steps.version.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $aliasTag = "latest-beta"

          gh release view $aliasTag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $aliasTag --cleanup-tag --yes
          }

          gh release create $aliasTag `
            .\release-artifacts\ThermoPrinterTool.exe `
            .\release-artifacts\ThermoPrinterTool.exe.sha256 `
            .\release-artifacts\ThermoPrinterTool.zip `
            --target $env:RELEASE_TARGET `
            --title "ThermoPrinterTool latest beta" `
            --notes "Permanent download alias for $env:RELEASE_TAG" `
            --prerelease
